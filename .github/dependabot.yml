version: 2
updates:
  # 1. Python Dependencies (pip) across all modules
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/surrol_official/Benchmark/state_based/rl"
      - "/surrol_official/Benchmark/state_based/MPM"
      - "/surrol_official/VPPV/Deployment/dvrk/FastSAM"
      - "/surrol_official/VPPV/Deployment/Sentire/FastSAM"
      - "/surrol_official/VPPV/Deployment/Sentire/co-tracker/gradio_demo"
      - "/surrol_official/VPPV/Training/policy_learning/rl/agents/torchhub/facebookresearch_dinov2_main"
      - "/google_deepmind_menagerie/test"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  # 2. GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
