name: Colab Cloud Keeper

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/colab_keeper.yml'

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-colab-cli requests

      - name: Configure Colab Multi-Account Pool
        env:
          COLAB_ACCOUNTS_JSON: ${{ secrets.COLAB_ACCOUNTS_JSON }}
          COLAB_SESSIONS_JSON: ${{ secrets.COLAB_SESSIONS_JSON }}
        run: |
          mkdir -p ~/.config/colab-cli
          mkdir -p training/colab_accounts
          python -c "
          import os, json
          data = json.loads(os.environ.get('COLAB_ACCOUNTS_JSON', '{}'))
          for name, content in data.items():
              with open(f'training/colab_accounts/{name}.json', 'w') as f:
                  json.dump(content, f)
          print(f'Restored {len(data)} accounts in pool.')
          "
          # Set default active account to account_2
          if [ -f training/colab_accounts/account_2.json ]; then
            cp training/colab_accounts/account_2.json ~/.config/colab-cli/token.json
          fi
          echo "$COLAB_SESSIONS_JSON" > ~/.config/colab-cli/sessions.json
          chmod 600 ~/.config/colab-cli/*.json || true

      - name: Run Multi-Account Cloud Relay
        run: |
          python -u training/colab_relay.py

